[project]
name = "virtual-ai"
version = "0.1.0"
description = "Local AI character orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "PyYAML>=6.0,<7",
    "sounddevice>=0.5.3,<0.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "editables>=0.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_ai"]

[tool.hatch.build]
dev-mode-exact = true
