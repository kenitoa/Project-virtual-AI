[project]
name = "virtual-ai"
version = "0.1.0"
description = "Local AI character orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.84.0",
    "httpx>=0.28.1",
    "keyring>=25,<26",
    "protobuf==7.36.2",
    "psutil>=7,<8",
    "PyYAML>=6.0,<7",
    "sounddevice>=0.5.3,<0.6",
    "websockets>=15,<18",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "editables>=0.5,<1",
    "grpcio-tools==1.84.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/virtual_ai/integrations/_youtube_proto/*_pb2*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_ai"]

[tool.hatch.build]
dev-mode-exact = true
