# character_path는 이 설정 파일의 폴더 기준입니다.
youtube:
  transport: rest # stream은 고정된 protobuf/gRPC streamList 경로. 자동 대체 없음
  auth_mode: manual # oauth는 youtube-auth.md의 최초 승인과 방송 선택 후 사용
  channel_id: ""
  broadcast_id: ""
  enabled: false  # enable only after manual OBS recording verification
  live_chat_id: ""  # live chat ID, not a video ID; token in YOUTUBE_ACCESS_TOKEN
llm:
  backend: fake  # mock/fake는 고정 응답, 실제 서버는 koboldcpp
  base_url: http://127.0.0.1:5001
  model: Qwen3-8B
  max_output_tokens: 256
  context_tokens: 4096  # 검증 기준 서버 --contextsize 4096과 일치; 서버 변경 시 함께 검증
  timeout_seconds: 30  # 연결/읽기/쓰기/풀 대기 각각의 제한
  total_timeout_seconds: 60  # 재시도와 대기를 포함한 전체 호출 제한
  server_abort_enabled: false  # enable only after verifying keyed abort; see docs/backends.md
  abort_timeout_seconds: 3  # separate cleanup deadline (maximum 30 seconds)
  retries: 0  # 최초 시도 외 추가 시도; 최대 3
tts:
  enabled: false
  base_url: http://127.0.0.1:9880
  ref_audio_path: ""  # 사용 권한이 있는 참조 음성의 서버 측 경로
  prompt_text: ""  # 참조 음성의 실제 전사문; 운영자가 지정
  prompt_lang: ko
  text_lang: ko
  timeout_seconds: 60
  total_timeout_seconds: 120
  max_text_chars: 1000
  max_response_bytes: 20971520
audio:
  enabled: false
  output_device: null  # null: 시스템 기본 출력; 장치 번호 또는 이름도 가능
character_path: character.yaml
subtitles:
  enabled: false
  path: ../.local/obs-subtitle.txt  # fixed UTF-8 file for OBS; relative to this config
vts:
  enabled: false
  url: ws://127.0.0.1:8001
  plugin_name: ProjectVirtualAI
  plugin_developer: ProjectVirtualAITeam
  token_path: ../.local/vts-token.json  # relative to this config; Git-ignored
  request_timeout_seconds: 2
  authentication_timeout_seconds: 60
  expected_model_id: ""  # required for expression changes; obtain with --list-hotkeys
  lipsync_enabled: false
  mouth_parameter: ""  # existing VTS INPUT parameter, not a Live2D parameter ID
  lipsync_hz: 25  # maximum 30; no backlog
  lipsync_gain: 4
  lipsync_smoothing: 0.4  # exponential smoothing weight (0, 1]
  expression_hotkeys:
    happy: ""  # operator-selected ToggleExpression hotkey IDs
    sad: ""
limits:
  max_input_chars: 1000
  history_turns: 6
  history_chars: 6000
  history_ttl_seconds: 3600
  max_viewers: 100
  queue_size: 20
  queue_per_user: 2
  queue_max_consecutive: 1 # 다른 사용자가 기다릴 때 적용
  queue_ttl_seconds: 30
output:
  max_output_chars: 600
  max_sentences: 3
  blocked_terms: []  # 금지 문구 설정; 의미 기반 검사를 대체하지 않음
  allowed_expressions: [neutral, happy, sad]
