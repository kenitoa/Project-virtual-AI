name: Python checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          python-version: "3.11"
      - run: uv sync --locked
      - name: Tests
        run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Entry point smoke check
        run: uv run --locked python -m virtual_ai --backend mock --once hello
